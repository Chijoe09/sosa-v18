<!DOCTYPE html>
<html>
<head>
<title>SOSA Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh;background:#111;color:white} .box{background:#222;padding:30px;border-radius:10px;text-align:center} input{padding:10px;width:200px;margin:10px} button{padding:10px 20px;background:gold;border:none;cursor:pointer;font-weight:bold}</style>
</head>
<body>
<div class="box">
<h2>SOSA Admin Login</h2>
<input type="password" id="pw" placeholder="Enter password">
<br><button onclick="login()">Login</button>
<p id="msg"></p>
</div>
<script>
function login(){
  if(document.getElementById('pw').value==='sosa5463'){
    localStorage.setItem('sosa_admin','true');
    window.location.href='/?admin=1';
  } else {
    document.getElementById('msg').innerText='Wrong password!';
  }
}
</script>
</body>
</html>
